# ============================================================
# 企业绿色评级系统 · Nginx 配置（HTTPS）
# 适用于 Linux 原生部署 与 Docker 部署（Dockerfile 内置此文件）
#
# HTTPS 说明：
#   - 证书文件路径：/etc/nginx/certs/server.crt 与 server.key
#   - Docker 部署：通过 volume 挂载证书目录（见 docker-compose.yml）
#   - Linux 原生部署：将证书放到 /etc/nginx/certs/ 或修改下方路径
#   - 没有证书时：可用 deploy/scripts/gen-selfsigned-cert.sh 生成自签名证书（仅测试）
#   - 80 端口自动 301 跳转 HTTPS
# ============================================================

# ---- HTTPS 主站点 ----
server {
    listen       443 ssl;
    http2        on;
    server_name  _;               # 生产环境改为实际域名，如 uat.carbon-grading.com
    root         /usr/share/nginx/html;
    index        index.html;

    # ---- SSL 证书（Docker 挂载目录 /etc/nginx/certs）----
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # ---- TLS 安全策略 ----
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # HSTS

    # ---- gzip 压缩 ----
    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---- 静态资源（assets/）：长缓存 ----
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- join-us 独立页：短缓存 ----
    location /join-us/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }

    # ---- SPA 入口：index.html 永不缓存 ----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
    }

    # ---- API 路径（本站无后端则 404，不被 fallback 吞掉）----
    location /DataServices/ {
        return 404;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- HTTP → HTTPS 强制跳转 ----
server {
    listen       80;
    server_name  _;

    # 全站 301 跳转 HTTPS
    return 301 https://$host$request_uri;
}
