# ============================================================
# 企业绿色评级系统 · Nginx 配置
# 适用于 Linux 原生部署 与 Docker 部署（Dockerfile 内置此文件）
# 说明：
#   - 本站为纯静态前端（React SPA + join-us 独立页）
#   - 业务 API 由浏览器直连企业后台（config.js 的 __entUrl__），本站不代理
#   - SPA pathname 路由（/financial-supermarket、/certificate-query）刷新需 fallback 到 index.html
# ============================================================

server {
    listen       80;
    server_name  _;               # 生产环境改为实际域名，如 uat.carbon-grading.com
    root         /usr/share/nginx/html;
    index        index.html;

    # ---- gzip 压缩（HTML/JS/CSS/JSON）----
    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 静态资源（assets/）：长缓存（1年），文件名带 hash 可安全缓存 ----
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- join-us 独立页：短缓存 ----
    location /join-us/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }

    # ---- SPA 入口：index.html 永不缓存（保证发布后立即生效）----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
    }

    # ---- API 路径（若有本域 API 则走这里；当前全部直连企业后台，此段按需保留）----
    location /DataServices/ {
        # 本站无 API 后端：直接返回 404（不被 SPA fallback 吞掉）
        return 404;
    }

    # ---- SPA fallback：非真实文件的 GET 请求回退 index.html（防 pathname 路由刷新 404）----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
